# Controlla che quello che il sito serve davvero sia indicizzabile.
#
# Gira dopo ogni deploy di produzione. Verifica che ogni URL della sitemap
# esista, sia raggiungibile da un link vero nell'HTML servito, non sia escluso
# dagli indici e dichiari le altre lingue in modo reciproco. Il job fallisce
# se trova un problema bloccante, cosi' arriva la notifica di GitHub.
name: Controllo indicizzabilita

on:
  deployment_status:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - 'src/**'

      - '.github/**'
jobs:
  controlla:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Lascia il tempo al deploy di andare online
        if: github.event_name == 'push'
        run: sleep 90

      - name: Checkout del commit deployato
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Controlla che il sito sia indicizzabile
        env:
          SITE_URL: https://garibaldina-75.romagna-affitti-brevi.it
        run: node .github/scripts/check-indexability.mjs

  segnala:
    needs: controlla
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Segnala gli URL a IndexNow
        run: |
          HOST="https://garibaldina-75.romagna-affitti-brevi.it"
          KEY="e3e4dcddad16ebc9ccf8508b20b95082"
          URLS=$(curl -sS --max-time 20 "$HOST/sitemap.xml" | grep -oE '<loc>[^<]+</loc>' | sed -e 's/<loc>//' -e 's|</loc>||')
          COUNT=$(echo "$URLS" | grep -c . || true)
          echo "URL da segnalare: $COUNT"
          if [ "$COUNT" -eq 0 ]; then echo "sitemap vuota, esco senza errore"; exit 0; fi
          LIST=$(echo "$URLS" | sed 's/.*/"&"/' | paste -sd, -)
          BODY="{\"host\":\"${HOST#https://}\",\"key\":\"$KEY\",\"keyLocation\":\"$HOST/$KEY.txt\",\"urlList\":[$LIST]}"
          CODE=$(curl -sS -o /tmp/out.txt -w '%{http_code}' -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" --data "$BODY")
          echo "HTTP $CODE"; cat /tmp/out.txt
          case "$CODE" in 200|202) exit 0 ;; *) echo "IndexNow ha rifiutato la segnalazione"; exit 1 ;; esac
