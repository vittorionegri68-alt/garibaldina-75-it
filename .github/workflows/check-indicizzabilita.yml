# Controlla che quello che il sito serve davvero sia indicizzabile.
#
# Gira dopo ogni deploy di produzione. Verifica che ogni URL della sitemap
# esista, sia raggiungibile da un link vero nell'HTML servito, non sia escluso
# dagli indici e dichiari le altre lingue in modo reciproco. Il job fallisce
# se trova un problema bloccante, cosi' arriva la notifica di GitHub.
name: Controllo indicizzabilita

on:
  deployment_status:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - 'src/**'

      - '.github/**'
jobs:
  controlla:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Lascia il tempo al deploy di andare online
        if: github.event_name == 'push'
        run: sleep 90

      - name: Checkout del commit deployato
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Controlla che il sito sia indicizzabile
        env:
          SITE_URL: https://garibaldina-75.romagna-affitti-brevi.it
        run: node .github/scripts/check-indexability.mjs

